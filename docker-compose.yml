services:
  ggs:
    image: ghcr.io/kwzwk/ggs:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      # Public hostname(s) the reverse proxy forwards, comma-separated.
      GGS_ALLOWED_HOSTS: "*"
      # Set when the app is served under a sub-path, e.g. /lernplan.
      GGS_BASE_PATH: ""
      # Set to "false" only if you use the app over plain http.
      GGS_HTTPS_ONLY: "true"
    labels:
      # Lets Watchtower (below) update this container.
      com.centurylinklabs.watchtower.enable: "true"

  # Pulls ghcr.io/kwzwk/ggs:latest every 5 minutes and restarts the app when
  # CI has published a new image. Only touches containers labelled above.
  # nickfedor/watchtower is the maintained fork of containrrr/watchtower,
  # which is no longer maintained.
  watchtower:
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Only needed while the GHCR package is private: run `docker login ghcr.io`
      # on the server (as the user that runs compose), then uncomment.
      # - ${HOME}/.docker/config.json:/config.json:ro
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_CLEANUP: "true"
